<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}School Reports Management System{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; }
    nav { background: #1a73e8; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 20px; }
    nav a { color: #fff; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    .container { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 1.6rem; margin-bottom: 16px; }
    h2 { font-size: 1.2rem; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    th { background: #1a73e8; color: #fff; padding: 10px 14px; text-align: left; }
    td { padding: 10px 14px; border-bottom: 1px solid #e0e0e0; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f0f4ff; }
    .card { background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 20px; margin-bottom: 20px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: .8rem; font-weight: bold; }
    .badge-A { background:#d4edda; color:#155724; }
    .badge-B { background:#cce5ff; color:#004085; }
    .badge-C { background:#fff3cd; color:#856404; }
    .badge-D { background:#ffd5d5; color:#7b2020; }
    .badge-F { background:#f8d7da; color:#721c24; }
    .stat { display: inline-block; text-align: center; padding: 16px 24px; background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.1); margin-right:12px; }
    .stat .number { font-size: 2rem; font-weight: bold; color: #1a73e8; }
    .stat .label  { font-size: .85rem; color: #666; }
    a.btn { display: inline-block; padding: 6px 14px; background: #1a73e8; color: #fff; border-radius: 4px; text-decoration: none; font-size: .85rem; }
    a.btn:hover { background: #1558b0; }
    a.btn-secondary { background: #6c757d; }
    a.btn-secondary:hover { background: #545b62; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'reports:dashboard' %}">🏫 School Reports</a>
    <a href="{% url 'reports:student_list' %}">Students</a>
    <a href="/admin/">Admin</a>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
